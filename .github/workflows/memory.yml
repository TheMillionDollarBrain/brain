name: Refresh memory
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: curl -fsSL https://themilliondollarbrain.com/llms.txt -o memory/llms.txt
      - run: |
          git config user.name "The Million Dollar Brain"
          git config user.email "milliondollarbrain@proton.me"
          git add memory/llms.txt
          git diff --cached --quiet || git commit -m "memory: $(date -u +%F)"
          git push
